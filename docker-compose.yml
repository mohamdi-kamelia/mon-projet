services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - ws-server
      - bbb-backend
    restart: unless-stopped

  ws-server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped

  bbb-backend:
    build:
      context: ./backend/bbb-backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - BBB_URL=${BBB_URL}
      - BBB_SECRET=${BBB_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - auth-data:/root/
    restart: unless-stopped

volumes:
  auth-data:
